[package]
name = "periodica_core"
# NOT inherited from the workspace. This version is bound by the 4-location
# sync rule in CLAUDE.md (pyproject.toml / this file / src/periodica/__init__.py
# / the git tag) and is what `periodica._periodica_core.__version__` reports to
# the Python handshake. Bump it only as part of a release.
version = "2.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Periodica core: data-driven scientific composition, sampling, predictors, alloy and protein engines, shader export, Fourier baking."

[lib]
name = "periodica_core"
crate-type = ["cdylib", "lib"]

[features]
default = []
# The PyO3 bindings (`src/pyfacade/`). Links libpython, so
# `cargo test -p periodica_core --features python` builds a test binary that
# can initialise an interpreter and run the binding tests.
python = ["dep:pyo3", "dep:numpy"]
# What the wheel is built with ([tool.maturin] in pyproject.toml): the bindings
# plus `pyo3/extension-module`, which leaves libpython to the host interpreter.
# Never use it for `cargo test` -- the test binary cannot link on Linux/macOS.
extension-module = ["python", "pyo3/extension-module"]
abi3 = ["pyo3/abi3-py310"]

[dependencies]
periodica-mat.workspace = true
serde.workspace = true
serde_json.workspace = true
ndarray.workspace = true
dashmap.workspace = true
rayon.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# Pure-Rust linear algebra — used for Kabsch SVD in protein.rs (no OpenBLAS required).
nalgebra.workspace = true
# Seeded RNG for deterministic alloy composition search.
rand.workspace = true
sha1.workspace = true
pyo3 = { workspace = true, optional = true }
# Zero-copy ndarray <-> numpy at the binding boundary.
numpy = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
