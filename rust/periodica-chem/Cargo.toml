[package]
name = "periodica-chem"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Chemistry model for periodica: chemical formula parsing and curated 3D molecular geometry. No pyo3, no filesystem access."

[lib]
name = "periodica_chem"

# Sits directly above periodica-mat in the DAG (see the workspace Cargo.toml);
# periodica-qm and periodica-render build on it. No pyo3.
[dependencies]
periodica-mat.workspace = true
